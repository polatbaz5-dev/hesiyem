<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Küçük bir sürpriz 💌</title><meta property="og:title" content="Sana küçük bir sürprizim var 💌"><meta property="og:description" content="Hediyeni açınca göreceksin!"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;font-family:system-ui,sans-serif;background:radial-gradient(circle at 20% 15%,#fff5f8,#ffd4e4 48%,#f9a9c8);color:#a31954}.scene{position:relative;z-index:2;text-align:center;padding:24px;width:min(94vw,520px)}.hint{font-size:1.05rem;margin-bottom:18px}.gift{border:0;background:transparent;cursor:pointer;display:inline-grid;place-items:center;transition:transform .2s;filter:drop-shadow(0 14px 16px #a3195430)}.gift:hover{transform:translateY(-4px) scale(1.03)}.giftbox{position:relative;width:190px;height:150px}.base{position:absolute;bottom:0;left:12px;width:166px;height:112px;border-radius:12px 12px 18px 18px;background:linear-gradient(135deg,#f34f91,#cf236c);border:3px solid #fff1f6}.lid{position:absolute;top:28px;left:0;width:190px;height:42px;border-radius:10px;background:linear-gradient(135deg,#ff8db9,#e83e80);border:3px solid #fff1f6;z-index:2}.ribbon{position:absolute;top:28px;left:78px;width:34px;height:122px;background:#ffe8a8;z-index:3}.bow{position:absolute;top:0;left:68px;width:54px;height:38px;z-index:4}.bow:before,.bow:after{content:"";position:absolute;width:29px;height:24px;border:7px solid #ffe8a8;border-radius:80% 20% 80% 20%;transform:rotate(25deg)}.bow:after{left:25px;transform:scaleX(-1) rotate(25deg)}.giftlabel{position:absolute;z-index:5;top:70px;width:100%;font-size:28px}.bubble{display:inline-block;margin-top:24px;padding:14px 22px;border-radius:22px;background:white;color:#b51f60;font-weight:750;box-shadow:0 8px 22px #a3195420;position:relative;cursor:pointer}.bubble:after{content:"";position:absolute;top:-9px;left:calc(50% - 9px);border-width:0 10px 10px;border-style:solid;border-color:transparent transparent white}.bubble small{display:block;font-weight:500;font-size:.88rem;margin-top:3px}.hidden{display:none}h1{font-size:clamp(2.2rem,9vw,4rem);line-height:1.05;margin:12px 0;color:#c2185b;text-shadow:0 2px #fff8}.sub{font-size:1.1rem;color:#9b2458}.float{position:fixed;z-index:1;bottom:-45px;pointer-events:none;animation:rise linear forwards;opacity:.85}@keyframes rise{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}@keyframes pop{from{opacity:0;transform:scale(.65)}to{opacity:1;transform:scale(1)}}.reveal{animation:pop .65s cubic-bezier(.2,.8,.2,1) both}</style></head><body><main class="scene"><section id="start"><div class="hint">Sana minicik bir sürprizim var…</div><button class="gift" id="openGift" aria-label="Hediyeyi aç"><span class="giftbox"><span class="base"></span><span class="ribbon"></span><span class="lid"></span><span class="bow"></span><span class="giftlabel">♡</span></span></button><div class="bubble" id="bubble">🎁 Hediyeyi aç<small>Hediye kutusuna dokun!</small></div></section><section id="surprise" class="hidden"><div style="font-size:3rem">💗 💖 💕</div><h1>Seni çok seviyorum!</h1><p class="sub">İyi ki varsın. Bu küçük hediye senin için. 💌</p><button id="again" style="border:0;border-radius:999px;padding:11px 18px;background:#e83e80;color:white;font-size:1rem;cursor:pointer">Tekrar aç 💝</button></section></main><script>
const start=document.getElementById('start'),surprise=document.getElementById('surprise');function hearts(){const symbols=['💗','💖','💕','💘','❤️','♥'];for(let i=0;i<42;i++){const h=document.createElement('span');h.className='float';h.textContent=symbols[Math.floor(Math.random()*symbols.length)];h.style.left=Math.random()*100+'vw';h.style.fontSize=(17+Math.random()*28)+'px';h.style.animationDuration=(4+Math.random()*6)+'s';h.style.animationDelay=(Math.random()*1.5)+'s';document.body.appendChild(h);h.addEventListener('animationend',()=>h.remove())}}function open(){start.classList.add('hidden');surprise.classList.remove('hidden');surprise.classList.add('reveal');hearts()}document.getElementById('openGift').addEventListener('click',open);document.getElementById('bubble').addEventListener('click',open);document.getElementById('again').addEventListener('click',()=>{surprise.classList.add('hidden');start.classList.remove('hidden')});
</script></body></html>
